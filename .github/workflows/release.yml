name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that config.xml version matches the tag
        run: |
          v=$(grep -oP '<widget[^>]*\bversion="\K[^"]+' app/config.xml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "app/config.xml version is $v but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build LightKickTV.wgt
        run: python scripts/build.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LightKickTV.wgt dist/LightKickTV.wgt.sha256 \
            --title "Light Kick TV $GITHUB_REF_NAME" --generate-notes
