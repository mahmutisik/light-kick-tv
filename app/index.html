<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
  <title>Light Kick TV</title>
  <!-- Start connecting to Kick's servers right away (DNS + TCP + TLS), while the splash is showing,
       so the first API call and thumbnails don't each pay for the connection setup. -->
  <link rel="preconnect" href="https://web.kick.com" crossorigin>
  <link rel="preconnect" href="https://kick.com" crossorigin>
  <link rel="preconnect" href="https://images.kick.com">
  <link rel="preconnect" href="https://files.kick.com">
  <link rel="dns-prefetch" href="https://web.kick.com">
  <link rel="dns-prefetch" href="https://images.kick.com">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">

    <!-- Shared top bar on every screen except the player: logo (home), search, categories, filter,
         settings. The current section is shown in green. -->
    <header class="topbar shared" id="topbar">
      <button class="brand focusable" id="btnHome" aria-label="Home"><img class="brand-logo" src="img/kick-logo.svg" alt="Kick"></button>
      <nav class="topnav">
        <button class="pill focusable" id="btnSearch" data-i18n="search"></button>
        <button class="pill focusable" id="btnCategories" data-i18n="categories"></button>
        <button class="pill focusable" id="btnFilter"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M3 5h18l-7 8.5V19l-4 2v-7.5L3 5Z"/></svg><span id="filterSummary"></span></button>
        <button class="pill icon focusable" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
      </nav>
    </header>

    <!-- Ana sayfa -->
    <section id="home" class="screen">
      <div class="scroller" id="homeScroll">
        <div id="followWrap" class="section hidden">
          <h2 data-i18n="followedLive"></h2>
          <div class="grid" id="followGrid"></div>
          <div class="note" id="followNote"></div>
        </div>
        <div id="continueWrap" class="section hidden">
          <h2 data-i18n="continueWatching"></h2>
          <div class="grid" id="continueGrid"></div>
        </div>
        <div id="recentWrap" class="section hidden">
          <h2 data-i18n="recentChannels"></h2>
          <div class="chips" id="recentList"></div>
        </div>
        <div class="section">
          <h2 id="liveTitle"></h2>
          <div class="grid" id="liveGrid"></div>
          <div class="note" id="liveNote"></div>
        </div>
      </div>

    </section>

    <!-- Arama -->
    <section id="search" class="screen hidden">
      <div class="search-row">
        <input id="searchInput" class="focusable" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="scroller" id="searchScroll">
        <div id="historyWrap" class="section hidden">
          <h2 data-i18n="recentSearches"></h2>
          <div class="chips wrap" id="historyList"></div>
        </div>
        <div id="searchCatWrap" class="section hidden">
          <h2 data-i18n="gamesAndCategories"></h2>
          <div class="grid cats" id="searchCats"></div>
        </div>
        <h2 id="searchChanTitle" class="list-title hidden" data-i18n="channelsTitle"></h2>
        <div class="grid channels" id="searchGrid"></div>
        <div class="note" id="searchNote"></div>
      </div>
    </section>

    <!-- Games & categories -->
    <section id="categories" class="screen hidden">
      <div class="scroller" id="categoriesScroll">
        <div class="grid cats" id="catGrid"></div>
        <div class="note" id="catNote"></div>
      </div>
    </section>

    <!-- One game / category: its live streams -->
    <section id="category" class="screen hidden">
      <div class="scroller" id="categoryScroll">
        <div class="page-head"><h2 id="catTitle"></h2><span class="muted" id="catSub"></span></div>
        <div class="grid" id="catLiveGrid"></div>
        <div class="note" id="catLiveNote"></div>
      </div>
    </section>

    <!-- Kanal -->
    <section id="channel" class="screen hidden">
      <div class="scroller" id="channelScroll">
        <div class="channel-head">
          <img id="chAvatar" class="avatar big" alt="">
          <div class="channel-info">
            <div class="channel-name"><span id="chName"></span> <span id="chLive" class="badge live hidden">LIVE</span></div>
            <div class="muted" id="chMeta"></div>
            <div class="channel-title" id="chTitle"></div>
            <div class="actions">
              <button class="btn primary focusable hidden" id="btnWatchLive" data-i18n="watchLive"></button>
              <button class="btn focusable hidden" id="btnFollow"></button>
            </div>
          </div>
        </div>
        <!-- Past broadcasts / clips: one list at a time, switched with OK on these tabs -->
        <div class="chips tabs">
          <button class="pill focusable active" id="tabVods" data-i18n="pastBroadcasts"></button>
          <button class="pill focusable" id="tabClips" data-i18n="clips"></button>
        </div>
        <div class="section" id="vodSection">
          <div class="grid" id="vodGrid"></div>
          <div class="note" id="vodNote"></div>
        </div>
        <div class="section hidden" id="clipSection">
          <div class="grid" id="clipGrid"></div>
          <div class="note" id="clipNote"></div>
        </div>
      </div>
    </section>

    <!-- Ayarlar -->
    <section id="settings" class="screen hidden">
      <div class="scroller" id="settingsScroll">
        <div class="section">
          <h2 data-i18n="uiLanguage"></h2>
          <div class="chips wrap" id="uiLangs"></div>
        </div>
        <div class="section">
          <h2 data-i18n="followedChannels"></h2>
          <div id="followList"></div>
          <div class="note" id="followListNote"></div>
        </div>
        <div class="section">
          <h2 data-i18n="about"></h2>
          <div class="about focusable" id="aboutRow">
            <div>Light Kick TV &nbsp;·&nbsp; <span id="aboutVersion"></span></div>
            <div class="muted about-status" id="aboutStatus"></div>
          </div>
          <div class="actions"><button class="btn focusable" id="btnWhatsNew" data-i18n="whatsNew"></button></div>
        </div>
      </div>
    </section>

    <!-- Oynatıcı -->
    <section id="player" class="screen hidden">
      <video id="video" playsinline></video>
      <div id="playerStatus" class="player-status hidden">
        <div class="spinner"></div>
        <div class="status-title" id="statusTitle"></div>
        <div class="status-detail" id="statusDetail"></div>
      </div>
      <div id="pauseIcon" class="pause-icon hidden"><span></span><span></span></div>
      <div id="chatPanel" class="chat hidden">
        <div class="chat-head"><span data-i18n="liveChat"></span> <span id="chatState" class="muted"></span></div>
        <div class="chat-list" id="chatList"></div>
      </div>
      <div id="osd" class="osd">
        <div class="osd-top">
          <div class="osd-channel" id="osdChannel"></div>
          <div class="osd-title" id="osdTitle"></div>
        </div>
        <div class="osd-bottom">
          <div class="progress hidden" id="progress">
            <div class="progress-buffer" id="progressBuffer"></div>
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-knob" id="progressKnob"></div>
          </div>
          <div class="osd-row">
            <span class="badge live hidden" id="osdLive">LIVE</span>
            <span class="osd-viewers" id="osdViewers"></span>
            <span id="osdTime"></span>
            <span class="osd-quality" id="osdQuality"></span>
            <span class="osd-hint" id="osdHint"></span>
          </div>
        </div>
      </div>
      <div id="qualityMenu" class="menu hidden">
        <h3 data-i18n="quality"></h3>
        <div id="qualityList"></div>
      </div>
    </section>

    <!-- Stream filter: edits a draft; nothing reloads until "Apply". -->
    <div id="filterLayer" class="layer hidden">
      <div class="panel">
        <h3 data-i18n="filterTitle"></h3>
        <div class="panel-label" data-i18n="streamLanguage"></div>
        <div class="chips wrap" id="filterLangs"></div>
        <div class="panel-label" data-i18n="sortBy"></div>
        <div class="chips wrap" id="filterSort"></div>
        <div class="panel-hint" id="filterHint"></div>
        <div class="actions">
          <button class="btn primary focusable" id="filterApply" data-i18n="apply"></button>
          <button class="btn focusable" id="filterCancel" data-i18n="cancel"></button>
        </div>
      </div>
    </div>

    <!-- What's new: shown once after an update (and from Settings > About) -->
    <div id="newsLayer" class="layer hidden">
      <div class="panel news-panel">
        <h3 data-i18n="whatsNew"></h3>
        <div id="newsList"></div>
        <div class="actions"><button class="btn primary focusable" id="newsOk" data-i18n="ok"></button></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <!-- Start-up splash: visible as soon as the page is parsed, removed by app.js once the
         home screen is ready (at least ~1 s; if the list fails or takes over 10 s it shows an error and OK retries). -->
    <div id="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 20.53 24" aria-hidden="true"><path fill="#53FC18" d="M0 .028h7.7v5.32h2.561v-2.66h2.562V.028h7.7v7.996H17.96v2.66h-2.562v2.66h2.562v2.66h2.562V24h-7.699v-2.66h-2.562v-2.66H7.7V24H0V.028Z"/></svg>
        <div class="splash-word">LIGHT</div>
      </div>
      <div class="splash-bar" id="splashBar"><span></span></div>
      <div class="splash-msg hidden" id="splashMsg"><b id="splashErr"></b><span id="splashHint"></span></div>
    </div>
  </div>

  <!-- lib/hls.light.min.js (~380 KB) is loaded on demand by player.js, not at startup. -->
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/player.js"></script>
  <script src="js/whatsnew.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
